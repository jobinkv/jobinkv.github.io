<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ak" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#5a9a66"/></marker></defs><rect width="900" height="350" fill="#fff"/><text x="450" y="28" text-anchor="middle" font-size="18" fill="#222" font-weight="bold" >Finite state machine for a whole number followed by a comma (regex: [0-9]+,)</text>
<circle cx="160" cy="170" r="42" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="160" y="176" text-anchor="middle" font-size="18" fill="#222" font-weight="normal" >q0</text>
<circle cx="450" cy="170" r="42" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="450" y="176" text-anchor="middle" font-size="18" fill="#222" font-weight="normal" >q1</text>
<circle cx="740" cy="170" r="42" fill="#cdebd2" stroke="#333" stroke-width="2"/>
<circle cx="740" cy="170" r="34" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="740" y="176" text-anchor="middle" font-size="18" fill="#222" font-weight="normal" >q2</text>
<line x1="60" y1="170" x2="116" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<text x="60" y="156" text-anchor="middle" font-size="13" fill="#555" font-weight="normal" >start</text>
<line x1="204" y1="170" x2="406" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<text x="305" y="158" text-anchor="middle" font-size="14" fill="#222" font-weight="normal" >digit 0-9</text>
<line x1="494" y1="170" x2="696" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<text x="595" y="158" text-anchor="middle" font-size="18" fill="#222" font-weight="normal" >,</text>
<path d="M425,132 C395,40 505,40 475,132" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<text x="450" y="52" text-anchor="middle" font-size="14" fill="#222" font-weight="normal" >digit 0-9</text>
<text x="740" y="238" text-anchor="middle" font-size="13" fill="#555" font-weight="normal" >accepting state</text>
<text x="160" y="238" text-anchor="middle" font-size="13" fill="#555" font-weight="normal" >nothing read yet</text>
<text x="450" y="238" text-anchor="middle" font-size="13" fill="#555" font-weight="normal" >one or more digits read</text>
<text x="450" y="300" text-anchor="middle" font-size="14" fill="#444" font-weight="normal" >In each state only some tokens are allowed:  q0 → digits   |   q1 → digits or “,”   |   q2 → end of the field</text>
<text x="450" y="324" text-anchor="middle" font-size="14" fill="#444" font-weight="normal" >Any other token has no transition and is masked out (its logit becomes −∞).</text></svg>