<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2e6b2e"/>
    </marker>
  </defs>
  <rect width="900" height="280" fill="#ffffff"/>

  <text x="450" y="32" text-anchor="middle" font-size="20" fill="#222">CBOW: context words predict the center word</text>

  <!-- Bus lines from context words to target -->
  <g stroke="#2e6b2e" stroke-width="2" fill="none">
    <path d="M165,170 V120"/>
    <path d="M280,170 V120"/>
    <path d="M585,170 V120"/>
    <path d="M710,170 V120"/>
    <path d="M165,120 H710"/>
    <path d="M440,120 V165" marker-end="url(#ag)"/>
  </g>

  <!-- Words -->
  <g font-size="22" text-anchor="middle" fill="#222" font-family="Courier New, monospace">
    <rect x="130" y="170" width="70" height="50" fill="#e3f1e3" stroke="#2e6b2e" stroke-width="1.5"/>
    <text x="165" y="202">A</text>
    <rect x="230" y="170" width="100" height="50" fill="#e3f1e3" stroke="#2e6b2e" stroke-width="1.5"/>
    <text x="280" y="202">cute</text>
    <rect x="360" y="170" width="160" height="50" fill="#c4d7f5" stroke="#1f5fa8" stroke-width="2"/>
    <text x="440" y="202">teddy bear</text>
    <rect x="550" y="170" width="70" height="50" fill="#e3f1e3" stroke="#2e6b2e" stroke-width="1.5"/>
    <text x="585" y="202">is</text>
    <rect x="650" y="170" width="120" height="50" fill="#e3f1e3" stroke="#2e6b2e" stroke-width="1.5"/>
    <text x="710" y="202">reading</text>
  </g>

  <!-- Labels -->
  <g font-size="15" fill="#444" text-anchor="middle">
    <text x="437" y="90">predict</text>
    <text x="437" y="250">target (center) word</text>
    <text x="447" y="270" font-size="13" fill="#2e6b2e"> </text>
    <text x="165" y="250" fill="#2e6b2e">context</text>
    <text x="280" y="250" fill="#2e6b2e">context</text>
    <text x="585" y="250" fill="#2e6b2e">context</text>
    <text x="710" y="250" fill="#2e6b2e">context</text>
  </g>
</svg>
