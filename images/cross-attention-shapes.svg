<text x="535" y="260" text-anchor="middle" font-size="16" fill="#222" font-weight="bold">Output</text>
<text x="535" y="412" text-anchor="middle" font-size="13" fill="#555" font-weight="normal">N × D</text>
<text x="610" y="324" text-anchor="start" font-size="15" fill="#222" font-weight="bold">N output vectors,</text>
<text x="610" y="344" text-anchor="start" font-size="15" fill="#222" font-weight="bold">one per query, each of size D</text>
<text x="610" y="370" text-anchor="start" font-size="13" fill="#555" font-weight="normal">(M only disappears in the sum)</text></svg>