<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="900" height="470" fill="#fff"/><text x="450" y="28" text-anchor="middle" font-size="19" fill="#222" font-weight="bold">Cross-attention shapes: N queries, M keys/values, dimension D</text>
