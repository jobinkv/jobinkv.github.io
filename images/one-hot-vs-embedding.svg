<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1f5fa8"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#555"/>
    </marker>
    <marker id="ar" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 z" fill="#7a0019"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>

  <!-- Titles -->
  <text x="200" y="38" text-anchor="middle" font-size="20" fill="#222">Naive (one-hot) encoding</text>
  <text x="700" y="38" text-anchor="middle" font-size="20" fill="#222">Learned embedding</text>

  <!-- Left: one-hot -->
  <g>
    <line x1="200" y1="260" x2="200" y2="75" stroke="#555" stroke-width="1.5" marker-end="url(#ag)"/>
    <line x1="200" y1="260" x2="360" y2="260" stroke="#555" stroke-width="1.5" marker-end="url(#ag)"/>
    <line x1="200" y1="260" x2="110" y2="335" stroke="#555" stroke-width="1.5" marker-end="url(#ag)"/>
    <line x1="200" y1="260" x2="200" y2="105" stroke="#1f5fa8" stroke-width="3" marker-end="url(#ab)"/>
    <line x1="200" y1="260" x2="320" y2="260" stroke="#1f5fa8" stroke-width="3" marker-end="url(#ab)"/>
    <line x1="200" y1="260" x2="127" y2="320" stroke="#1f5fa8" stroke-width="3" marker-end="url(#ab)"/>
    <text x="212" y="100" font-size="17" fill="#222">teddy bear</text>
    <text x="300" y="285" font-size="17" fill="#222">soft</text>
    <text x="75" y="322" font-size="17" fill="#222">book</text>
  </g>

  <!-- Arrow between -->
  <path d="M410,215 H450 V195 L495,230 L450,265 V245 H410 Z" fill="#c4d7f5" stroke="#1f5fa8" stroke-width="1.5"/>

  <!-- Right: learned embedding -->
  <g>
    <line x1="700" y1="260" x2="700" y2="75" stroke="#555" stroke-width="1.5" marker-end="url(#ag)"/>
    <line x1="700" y1="260" x2="860" y2="260" stroke="#555" stroke-width="1.5" marker-end="url(#ag)"/>
    <line x1="700" y1="260" x2="610" y2="335" stroke="#555" stroke-width="1.5" marker-end="url(#ag)"/>
    <line x1="700" y1="260" x2="765" y2="125" stroke="#1f5fa8" stroke-width="3" marker-end="url(#ab)"/>
    <line x1="700" y1="260" x2="800" y2="185" stroke="#1f5fa8" stroke-width="3" marker-end="url(#ab)"/>
    <line x1="700" y1="260" x2="712" y2="345" stroke="#1f5fa8" stroke-width="3" marker-end="url(#ab)"/>
    <text x="690" y="115" font-size="17" fill="#222">teddy bear</text>
    <text x="812" y="185" font-size="17" fill="#222">soft</text>
    <text x="690" y="368" font-size="17" fill="#222">book</text>
  </g>

  <!-- Formulas -->
  <g font-size="16" fill="#222">
    <text x="55" y="392">soft = [1, 0, 0]</text>
    <text x="55" y="415">⟨teddy bear, book⟩ = 0     ⟨teddy bear, soft⟩ = 0</text>
    <text x="500" y="392">soft = [0.95, 0.32, 0.01]</text>
    <text x="500" y="415">⟨teddy bear, book⟩ ≈ 0     ⟨teddy bear, soft⟩ ≈ 1</text>
  </g>
</svg>
