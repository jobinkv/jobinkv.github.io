<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ak" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#b22222"/></marker><marker id="ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#1f5fa8"/></marker><marker id="ao" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#d28b2b"/></marker></defs><rect width="900" height="370" fill="#fff"/><text x="450" y="28" text-anchor="middle" font-size="19" fill="#222" font-weight="bold">RoPE rotates each query and key by an angle that grows with its position</text>
<line x1="30" y1="210" x2="280" y2="210" stroke="#333" stroke-width="1.3"/>
<line x1="150" y1="267.75" x2="150" y2="90" stroke="#333" stroke-width="1.3"/>
<line x1="150" y1="210" x2="255.0" y2="210.0" stroke="#b22222" stroke-width="3" marker-end="url(#ar)"/>
<line x1="150" y1="210" x2="217.49269901708664" y2="129.5653334725073" stroke="#b22222" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<path d="M198.0,210.0 A48,48 0 0 0 180.8538052649539,173.22986673028905" fill="none" stroke="#d28b2b" stroke-width="2"/>
<text x="210" y="232" text-anchor="middle" font-size="16" fill="#b22222" font-weight="normal">q_m</text>
<text x="239.6340264301905" y="108.71235572388979" text-anchor="middle" font-size="14" fill="#b22222" font-weight="normal">rotated q_m</text>
<text x="212" y="192" text-anchor="middle" font-size="14" fill="#d28b2b" font-weight="normal">m·θ</text>
<text x="150" y="322" text-anchor="middle" font-size="14" fill="#555" font-weight="normal">Query at position m = 2</text>
<line x1="330" y1="210" x2="580" y2="210" stroke="#333" stroke-width="1.3"/>
<line x1="450" y1="267.75" x2="450" y2="90" stroke="#333" stroke-width="1.3"/>
<line x1="450" y1="210" x2="555.0" y2="210.0" stroke="#1f5fa8" stroke-width="3" marker-end="url(#ab)"/>
<line x1="450" y1="210" x2="389.77447418314017" y2="123.98903534965588" stroke="#1f5fa8" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#ab)"/>
<path d="M498.0,210.0 A48,48 0 0 0 422.4683310551498,170.6807018741284" fill="none" stroke="#d28b2b" stroke-width="2"/>
<text x="510" y="232" text-anchor="middle" font-size="16" fill="#1f5fa8" font-weight="normal">k_n</text>
<text x="369.1557925834171" y="101.96769037529806" text-anchor="middle" font-size="14" fill="#1f5fa8" font-weight="normal">rotated k_n</text>
<text x="496.47540847351223" y="161.45728501023737" text-anchor="middle" font-size="14" fill="#d28b2b" font-weight="normal">n·θ</text>
<text x="450" y="322" text-anchor="middle" font-size="14" fill="#555" font-weight="normal">Key at position n = 5</text>
<line x1="630" y1="210" x2="880" y2="210" stroke="#333" stroke-width="1.3"/>
<line x1="750" y1="267.75" x2="750" y2="90" stroke="#333" stroke-width="1.3"/>
<line x1="750" y1="210" x2="817.4926990170866" y2="129.5653334725073" stroke="#b22222" stroke-width="3" marker-end="url(#ar)"/>
<line x1="750" y1="210" x2="689.7744741831401" y2="123.98903534965588" stroke="#1f5fa8" stroke-width="3" marker-end="url(#ab)"/>
<path d="M788.5672565811924,164.03733341286133 A60,60 0 0 0 715.5854138189372,160.8508773426605" fill="none" stroke="#d28b2b" stroke-width="2"/>
<text x="753.8385060881495" y="116.08375650079651" text-anchor="middle" font-size="14" fill="#d28b2b" font-weight="normal">(n−m)·θ</text>
<text x="859.0628759914443" y="121.7765334963657" text-anchor="middle" font-size="13" fill="#b22222" font-weight="normal">q rotated</text>
<text x="649.4500983288214" y="115.24429855245403" text-anchor="middle" font-size="13" fill="#1f5fa8" font-weight="normal">k rotated</text>
<text x="750" y="322" text-anchor="middle" font-size="14" fill="#555" font-weight="normal">Angle between them: (n − m)·θ</text>
<text x="450" y="345" text-anchor="middle" font-size="14" fill="#444" font-weight="normal">The dot product depends only on this angle, so it depends only on the relative distance n − m.</text></svg>