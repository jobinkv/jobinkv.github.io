<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ak" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#222"/>
    </marker>
    <marker id="al" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" fill="#222">An RNN reads one word at a time and predicts the next word</text>

  <!-- Outputs -->
  <g font-family="Courier New, monospace" font-size="19" text-anchor="middle">
    <rect x="95" y="60" width="110" height="44" fill="#fff" stroke="#8a8a8a"/>
    <text x="150" y="88" fill="#555">cute</text>
    <rect x="270" y="60" width="160" height="44" fill="#fff" stroke="#8a8a8a"/>
    <text x="350" y="88" fill="#555">teddy bear</text>
    <rect x="495" y="60" width="110" height="44" fill="#fff" stroke="#8a8a8a"/>
    <text x="550" y="88" fill="#555">is</text>
    <rect x="690" y="60" width="120" height="44" fill="#fff" stroke="#222" stroke-width="2"/>
    <text x="750" y="88" fill="#111">reading</text>
  </g>

  <!-- Output arrows -->
  <g stroke-width="1.5" fill="none">
    <path d="M150,150 V108" stroke="#8a8a8a" marker-end="url(#al)"/>
    <path d="M350,150 V108" stroke="#8a8a8a" marker-end="url(#al)"/>
    <path d="M550,150 V108" stroke="#8a8a8a" marker-end="url(#al)"/>
    <path d="M750,150 V108" stroke="#222" marker-end="url(#ak)"/>
  </g>

  <!-- RNN cells -->
  <rect x="95" y="150" width="110" height="100" fill="#e9f0fb" stroke="#9db7e0"/>
  <rect x="295" y="150" width="110" height="100" fill="#e9f0fb" stroke="#9db7e0"/>
  <rect x="495" y="150" width="110" height="100" fill="#e9f0fb" stroke="#9db7e0"/>
  <rect x="695" y="150" width="110" height="100" fill="#b8cff3" stroke="#1f5fa8" stroke-width="2"/>

  <!-- Hidden state arrows -->
  <g stroke-width="1.5" fill="none">
    <path d="M205,200 H291" stroke="#8a8a8a" marker-end="url(#al)"/>
    <path d="M405,200 H491" stroke="#8a8a8a" marker-end="url(#al)"/>
    <path d="M605,200 H691" stroke="#222" marker-end="url(#ak)"/>
  </g>
  <text x="648" y="190" text-anchor="middle" font-size="13" fill="#1f5fa8">hidden</text>
  <text x="648" y="226" text-anchor="middle" font-size="13" fill="#1f5fa8">state</text>

  <!-- Input arrows -->
  <g stroke-width="1.5" fill="none">
    <path d="M150,300 V254" stroke="#8a8a8a" marker-end="url(#al)"/>
    <path d="M350,300 V254" stroke="#8a8a8a" marker-end="url(#al)"/>
    <path d="M550,300 V254" stroke="#8a8a8a" marker-end="url(#al)"/>
    <path d="M750,300 V254" stroke="#222" marker-end="url(#ak)"/>
  </g>

  <!-- Inputs -->
  <g font-family="Courier New, monospace" font-size="19" text-anchor="middle">
    <rect x="115" y="300" width="70" height="44" fill="#fff" stroke="#8a8a8a"/>
    <text x="150" y="328" fill="#555">A</text>
    <rect x="300" y="300" width="100" height="44" fill="#fff" stroke="#8a8a8a"/>
    <text x="350" y="328" fill="#555">cute</text>
    <rect x="470" y="300" width="160" height="44" fill="#fff" stroke="#8a8a8a"/>
    <text x="550" y="328" fill="#555">teddy bear</text>
    <rect x="715" y="300" width="70" height="44" fill="#fff" stroke="#222" stroke-width="2"/>
    <text x="750" y="328" fill="#111">is</text>
  </g>

  <g font-size="14" fill="#444" text-anchor="middle">
    <text x="450" y="378">Input words (bottom) → RNN cells with a shared, repeated step → predicted next words (top)</text>
  </g>
</svg>
