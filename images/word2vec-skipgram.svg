<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2e6b2e"/>
    </marker>
  </defs>
  <rect width="900" height="280" fill="#ffffff"/>

  <text x="450" y="32" text-anchor="middle" font-size="20" fill="#222">Skip-gram: the center word predicts its context words</text>

  <!-- Words -->
  <g font-size="22" text-anchor="middle" fill="#222" font-family="Courier New, monospace">
    <rect x="130" y="60" width="70" height="50" fill="#e3f1e3" stroke="#2e6b2e" stroke-width="1.5"/>
    <text x="165" y="92">A</text>
    <rect x="230" y="60" width="100" height="50" fill="#e3f1e3" stroke="#2e6b2e" stroke-width="1.5"/>
    <text x="280" y="92">cute</text>
    <rect x="360" y="60" width="160" height="50" fill="#c4d7f5" stroke="#1f5fa8" stroke-width="2"/>
    <text x="440" y="92">teddy bear</text>
    <rect x="550" y="60" width="70" height="50" fill="#e3f1e3" stroke="#2e6b2e" stroke-width="1.5"/>
    <text x="585" y="92">is</text>
    <rect x="650" y="60" width="120" height="50" fill="#e3f1e3" stroke="#2e6b2e" stroke-width="1.5"/>
    <text x="710" y="92">reading</text>
  </g>

  <!-- Bus lines from target to context words (below the words) -->
  <g stroke="#2e6b2e" stroke-width="2" fill="none">
    <path d="M440,110 V160"/>
    <path d="M165,160 H710"/>
    <path d="M165,160 V115" marker-end="url(#ag)"/>
    <path d="M280,160 V115" marker-end="url(#ag)"/>
    <path d="M585,160 V115" marker-end="url(#ag)"/>
    <path d="M710,160 V115" marker-end="url(#ag)"/>
  </g>

  <!-- Labels -->
  <g font-size="15" fill="#444" text-anchor="middle">
    <text x="440" y="190">input: target (center) word</text>
    <text x="440" y="215" fill="#2e6b2e">predict each surrounding context word</text>
  </g>
</svg>
